version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stiqr-postgres
    restart: always
    environment:
      POSTGRES_USER: stiqr_user
      POSTGRES_PASSWORD: stiqr_password
      POSTGRES_DB: stiqr_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stiqr-redis
    restart: always
    ports:
      - '6379:6379'

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: stiqr-meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: stiqr_search_master_key
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data

volumes:
  postgres_data:
  meili_data:
