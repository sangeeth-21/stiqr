name = "stiqr-api"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database — run migration first:
#   npx wrangler d1 create stiqr-db
#   npx wrangler d1 migrations apply stiqr-db --remote
[[d1_databases]]
binding = "DB"
database_name = "stiqr-db"
database_id = "46f754dd-db5e-408e-9c2c-63613488accb"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "development"

# Secrets (use `wrangler secret put`, NOT `[vars]`):
#   echo "your-secret" | npx wrangler secret put JWT_SECRET
