name = "stiqr-backend"
main = "dist/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (set via wrangler secret put or dashboard)
[vars]
NODE_ENV = "production"
PORT = "4000"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "stiqr-db"
database_id = "46f754dd-db5e-408e-9c2c-63613488accb"
