services:
  - type: web
    name: stiqr-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: stiqr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromRedis:
          name: stiqr-redis
          property: connectionString
    autoDeploy:
      branch: main
    disk:
      name: stiqr-data
      mountPath: /app/data
      sizeGB: 1
